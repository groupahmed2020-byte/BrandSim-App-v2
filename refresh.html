function syncAiStatusUi(){

    if(window.AndroidBridge&&typeof window.AndroidBridge.isAiAgentEnabled==="function"){

}

function logAiAgent(msg){
  const box=document.getElementById("aiLogBox");
  const cnt=document.getElementById("aiCounterSpan");
  if(!box)return;
  const time=new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  const entry="["+time+"] "+msg;
  try{
    let saved=JSON.parse(localStorage.getItem("bs_ai_logs")||"[]");
    saved.push(entry);
    if(saved.length>40)saved=saved.slice(-40);
    localStorage.setItem("bs_ai_logs",JSON.stringify(saved));
    aiActionCount++;
    localStorage.setItem("bs_ai_count",String(aiActionCount));
    if(cnt)cnt.textContent="العمليات المنفذة: "+aiActionCount;
    box.textContent=saved.join("\n");
    box.scrollTop=box.scrollHeight;
  }catch(e){
    box.textContent+="\n"+entry;
    box.scrollTop=box.scrollHeight;
  }
}
window.logAiAgent=logAiAgent;

function cleanText(s){
  return String(s||"")
    .replace(/[\u0000-\u001F\u007F-\u009F<>]/g,"")
    .replace(/Sky\s*Telecom\s*2/gi,"Brand sim")
    .replace(/Sky\s*Telecom/gi,"Brand sim")
    .replace(/أرقام سكاي|ارقام سكاي/g,"ارقام براند سيم")
    .replace(/مركز الدعم الآلي لـ BRAND SIM/g,"مركز الدعم لـ BRAND SIM")
    .replace(/النظام الآلي/g,"فريق الدعم")
    .replace(/تلقائياً/g,"فوراً")
    .replace(/رد تلقائي/g,"رد الدعم")
    .trim()
    .slice(0,650);
}

function normalizePhoneNumber(rawInput){
  if(!rawInput)return"";
  let str=String(rawInput).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
  if(str.includes("_"))str=str.split("_")[0];str=str.replace(/[^0-9]/g,"");
  if(str.startsWith("00972")||str.startsWith("00970"))str="0"+str.slice(5);
  else if((str.startsWith("972")||str.startsWith("970"))&&str.length>=11)str="0"+str.slice(3);
  else if(str.length===9&&str.startsWith("5"))str="0"+str;
  else if(str.length>10&&str.startsWith("05"))str=str.slice(0,10);
  return str;
}

function getExpiryDiffDays(expStr){
  if(!expStr)return null;
  const s=String(expStr).trim();
  if(s==="موصول"||s==="-"||s==="مفتوح"||s==="دائم")return null;
  const now=new Date();now.setHours(0,0,0,0);
  let ex=new Date(s);
  if(isNaN(ex.getTime())){
    const parts=s.split(/[\/\-]/);
    if(parts.length===3){
      if(parts[0].length===4)ex=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
      else ex=new Date(Number(parts[2]),Number(parts[1])-1,Number(parts[0]));
    }
  }
  if(isNaN(ex.getTime()))return null;
  ex.setHours(0,0,0,0);
  return Math.ceil((ex-now)/86400000);
}

function isSubscriptionExpired(expStr){
  const diff=getExpiryDiffDays(expStr);
  return diff!==null&&diff<0;
}

function formatCustomerDetailsMessage(customer,cleanPhone){
  const pkg=String(customer.packageInfo||customer.package||customer.plan||customer.bundle||"باقة إنترنت").trim();
  const exp=String(customer.expiryDate||customer.expiry||customer.endDate||"").trim();
  const diff=getExpiryDiffDays(exp);
  let remText="";
  let expLine="";
  if(!exp||exp==="موصول"||exp==="-"){
    expLine="📅 حالة الاشتراك: موصول وفعّال";
    remText="⏳ المتبقي بالحزمة: الاشتراك ساري المفعول";
  }else if(diff===null){
    expLine="📅 تاريخ انتهاء الحزمة: "+exp;
  }else if(diff<0){
    expLine="📅 تاريخ انتهاء الحزمة: "+exp;
    remText="⚠️ المتبقي بالحزمة: منتهية منذ "+Math.abs(diff)+" يوم (يرجى التجديد)";
  }else if(diff===0){
    expLine="📅 تاريخ انتهاء الحزمة: "+exp+" (تنتهي اليوم)";
    remText="⏳ المتبقي بالحزمة: أقل من يوم واحد (ينتهي اليوم)";
  }else if(diff===1){
    expLine="📅 تاريخ انتهاء الحزمة: "+exp;
    remText="⏳ المتبقي بالحزمة: يوم واحد متبقي";
  }else if(diff===2){
    expLine="📅 تاريخ انتهاء الحزمة: "+exp;
    remText="⏳ المتبقي بالحزمة: يومان متبقيان";
  }else if(diff>=3&&diff<=10){
    expLine="📅 تاريخ انتهاء الحزمة: "+exp;
    remText="⏳ المتبقي بالحزمة: "+diff+" أيام متبقية";
  }else{
    expLine="📅 تاريخ انتهاء الحزمة: "+exp;
    remText="⏳ المتبقي بالحزمة: "+diff+" يوماً متبقياً";
  }
  let lines=[
    "📋 تفاصيل اشتراك الرقم: "+cleanPhone,
    "📦 الباقة والبيانات: "+pkg,
    expLine
  ];
  if(remText)lines.push(remText);
  return lines.join("\n");
}

function getSmartProviderTechTip(customer,mode){
  if(mode!=="weak_net"&&mode!=="refresh")return "";
  const p=String((customer.sourceProvider||"")+" "+(customer.packageInfo||"")+" "+(customer.company||"")).toLowerCase();
  let apnInfo="• تأكد من تفعيل التجوال والـ APN الصحيح ثم ضع وضع طيران 10 دقائق وأعد تشغيل الجهاز.";

function checkSkyCooldown(cleanPhone){
  try{
    if(window.AndroidBridge&&typeof window.AndroidBridge.getSkyCooldownRemainingMs==="function"){
      const rem=Number(window.AndroidBridge.getSkyCooldownRemainingMs(cleanPhone)||0);
      if(rem>0){
        const msg=window.AndroidBridge.getSkyCooldownRejectMsg(cleanPhone);
        return{blocked:true,msg:cleanText(msg||("⚠️ عذراً، طلب التحديث للرقم "+cleanPhone+" مرفوض لتكرار الطلب. يُسمح بتحديث ارقام براند سيم مرة واحدة فقط بعد 20 دقيقة."))};
      }
    }
    const raw=localStorage.getItem("sky_cd_"+cleanPhone);
    if(raw){
      const elapsed=Date.now()-Number(raw);
      if(elapsed>=0&&elapsed<SKY_COOLDOWN_MS){
        const remMs=SKY_COOLDOWN_MS-elapsed;
        const totalMins=Math.max(1,Math.ceil(remMs/60000));
        const hrs=Math.floor(totalMins/60);
        const mins=totalMins%60;
        const timeStr=(hrs>0&&mins>0)?(hrs+" ساعة و "+mins+" دقيقة"):(hrs>0?(hrs+" ساعة"):(mins+" دقيقة"));
        return{
          blocked:true,
          msg:"⚠️ عذراً، طلب التحديث للرقم "+cleanPhone+" مرفوض لتكرار الطلب.\nيُسمح بتحديث ارقام براند سيم مرة واحدة فقط بعد 20 دقيقة.\nيرجى المحاولة بعد مرور: "+timeStr+"."
        };
      }
    }
  }catch(e){}
  return{blocked:false,msg:""};
}

function recordSkyCooldown(cleanPhone){
  try{localStorage.setItem("sky_cd_"+cleanPhone,String(Date.now()));}catch(e){}
  try{
    if(window.AndroidBridge&&typeof window.AndroidBridge.markSkyRefreshed==="function"){
      window.AndroidBridge.markSkyRefreshed(cleanPhone);
    }
  }catch(e){}
}

      body:JSON.stringify({phone:cleanPhone})
    });
    const json=await res.json();

  try{

async function executeRefresh(rawNumber,senderPhone="",mode="refresh"){
  if(isRefreshing)return;
  if(!senderPhone&&Date.now()-lastSubmit<3000)return;
  const t=i18n[currentLang],cleanNumber=normalizePhoneNumber(rawNumber);phoneInput.value=cleanNumber;
  if(!/^05\d{8}$/.test(cleanNumber)){showMessage("warning",t.invalidPhone);return;}
  
  isRefreshing=true;
  lastSubmit=Date.now();
  submitBtn.disabled=true;
  submitBtn.classList.add("loading");
  btnText.textContent=t.loading;
  alertBox.style.display="none";
  
  try{
    const customer=await findCustomerInBackend(cleanNumber);
    if(!customer){
      showMessage("error",t.notAuthorized);
      logAiAgent("❌ رقم غير مسجل: "+cleanNumber);
      if(senderPhone&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
        window.AndroidBridge.sendSmsReply(senderPhone,t.notAuthorized);
      }
      return;
    }

    if(mode==="details"){
      const detailsReply=formatCustomerDetailsMessage(customer,cleanNumber);
      showMessage("success",detailsReply);
      logAiAgent("📋 استعلام حزمة للرقم: "+cleanNumber);
      if(senderPhone&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
        window.AndroidBridge.sendSmsReply(senderPhone,detailsReply);
      }
      return;
    }

    const p=String(customer.sourceProvider||customer.company||customer.provider||"").trim().toLowerCase();
    const pkg=String(customer.packageInfo||"").trim().toLowerCase();
    const isSky=p.includes("سكاي")||p.includes("sky")||pkg.includes("سكاي")||pkg.includes("sky");
    
    if(isSky&&isSubscriptionExpired(customer.expiryDate)){
      const expMsg=t.skyExpired;
      showMessage("error",expMsg);
      logAiAgent("⚠️ اشتراك منتهي: "+cleanNumber);
      if(senderPhone&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
        window.AndroidBridge.sendSmsReply(senderPhone,expMsg);
      }
      return;
    }

    if(isSky){
      const cd=checkSkyCooldown(cleanNumber);
      if(cd.blocked){
        showMessage("warning",cd.msg);
        logAiAgent("⏳ تكرار مرفوض (20د): "+cleanNumber);
        if(senderPhone&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
          window.AndroidBridge.sendSmsReply(senderPhone,cd.msg);
        }
        return;
      }
    }

    const res=isSky?await refreshViaSky(cleanNumber,senderPhone,mode):(p.includes("ارين")||p.includes("أرين")||p.includes("areen"))?await refreshViaAreen(cleanNumber):(p.includes("كويك")||p.includes("quick"))?await refreshViaQuickLine(cleanNumber):(p.includes("ايلول")||p.includes("أيلول")||p.includes("aylol")||p.includes("ayloul"))?await refreshViaAylol(cleanNumber):await refreshViaLayan(cleanNumber);
    let finalMsg=res.msg||(res.ok?t.defaultSuccess:t.defaultError);

    if(mode==="weak_net"&&!res.isSkyApp){
      finalMsg="تم تحديث الانترنت\n"+finalMsg+getSmartProviderTechTip(customer,mode);
    }

    logAiAgent("✅ تحديث ("+mode+") للرقم: "+cleanNumber);
    if(res.ok){showMessage("success",finalMsg);if(!res.isSkyApp)phoneInput.value="";}else showMessage("warning",finalMsg);
    if(senderPhone&&!res.isSkyApp&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
      window.AndroidBridge.sendSmsReply(senderPhone,finalMsg);
    }
  }catch(e){
    showMessage("error",t.defaultError);
    if(senderPhone&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
      window.AndroidBridge.sendSmsReply(senderPhone,t.defaultError);
    }
  }finally{
    isRefreshing=false;
    submitBtn.disabled=false;
    submitBtn.classList.remove("loading");
    btnText.textContent=t.btn;
  }
}

// الردود الذكية المرتبة حسب الأولويات الدقيقة (الشراء -> الشحن -> الإعدادات -> التحديث بشرط عدم النفي)
function buildSmartFallbackReply(rawMessage){
  const m=String(rawMessage||"").toLowerCase().trim();

  // أولوية 1: طلبات الشراء والاشتراك الجديد (حتى لو كتب الزبون معها "ما بدي احدث")
  if(/(اشتري|أشتري|شراء|بدي شريحة|بدي شريحه|بدي خط|تفعيل جديد|شريحة جديدة|شريحه جديده|عروض|أسعار|اسعار|كم سعر|متوفر)/.test(m)){
    return "أهلاً بك في مركز الدعم لـ BRAND SIM 🌟\nيسعدنا خدمتك! يرجى تزويدنا بتفاصيل طلبك لنقوم بتجهيزه لك فوراً:\n1️⃣ نوع الشريحة المطلوبة: (إلكترونية eSIM أم بلاستيك عادية؟)\n2️⃣ الشركة المفضلة: (بارتنر، ويكوم، هوت موبايل، 019، رامي ليفي، براند سيم)\n3️⃣ حجم الباقة والمدة: (شهرية أم عرض 3 شهور؟)\n(إذا كانت الشريحة البلاستيكية متوفرة لديك وتريد تفعيلها، يرجى إرسال صورة رقم السيريال ICCID الموجود خلف الشريحة).";
  }

  // أولوية 2: طلبات الشحن والتجديد
  if(/(بدي اشحن|بدي أشحن|اشحن|أشحن|شحن|تجديد|تمديد)/.test(m)){
    return "أهلاً بك في مركز الدعم لـ BRAND SIM 🌟\nيسعدنا خدمتك! يرجى إرسال رقم الشريحة المراد شحنها (05XXXXXXXX) ونوع الحزمة أو الباقة المطلوبة لنقوم بتجديدها وتأكيدها لك فوراً.";
  }

  // أولوية 3: إعدادات الإنترنت والـ APN وتنشيط eSIM
  if(/(اعدادات|إعدادات|apn|نقطة وصول|نقاط الوصول)/.test(m)){
    return "أهلاً بك في مركز الدعم لـ BRAND SIM 🌟\nإليك إعدادات نقطة الوصول (APN) حسب نوع شريحتك:\n• بارتنر (Partner): uinternet\n• ويكوم (Wecom): we\n• شريحة 019: netazi\n• هوت موبايل (Hot): net.hotm\nبعد كتابة الـ APN يدوياً، ضع الهاتف بوضع طيران 10 دقائق ثم أعد تشغيله.";
  }
  if(/(esim|الكتروني|إلكتروني|باركود|تنشيط)/.test(m)){
    return "أهلاً بك في مركز الدعم لـ BRAND SIM 🌟\nلتفعيل الشريحة الإلكترونية (eSIM) بشكل صحيح:\n1. تأكد من اتصالك بإنترنت قوي ومستقر (حتى لا يتلف الكود).\n2. امسح الباركود من داخل (إعدادات الهاتف -> الشبكة الخلوية -> إضافة شريحة إلكترونية) وليس من الكاميرا العادية.";
  }

  // أولوية 4: التحديث وفصل النت (بشرط عدم وجود نفي مثل "ما بدي احدث" أو "مش تحديث")
  const hasUpdateNegation=/(ما بدي احدث|ما بدي أحدث|مابدي احدث|مابدي أحدث|مش تحديث|مو تحديث|لا اريد تحديث|لا أريد تحديث|بدون تحديث|ما بدي تحديث)/.test(m);
  if(!hasUpdateNegation&&/(ضعيف|فاصل|مقطوع|ارسال|إرسال|اشارة|إشارة|لا توجد خدمة|تحديث|حدث|أحدث|احدث)/.test(m)){
    return "أهلاً بك في مركز الدعم لـ BRAND SIM 🌟\nيرجى إرسال رقم الشريحة المكون من 10 أرقام (مثال: 05XXXXXXXX) في رسالة الآن لنقوم بتحديثها وتنشيط الإنترنت لك فوراً!\n(ملاحظة: بعد التحديث، ضع الهاتف بوضع طيران 10 دقائق وأعد تشغيله).";
  }

  // الرد العام لمركز الدعم (بدون أي كلمات آلي أو تلقائي)
  return "أهلاً بك في مركز الدعم لـ BRAND SIM 🌟\n• لتحديث شريحتك أو فحص موعد انتهاء الحزمة: أرسل رقم الشريحة (05XXXXXXXX) الآن وسنقوم بتحديثها لك فوراً.\n• لطلب شريحة جديدة، شحن باقة، أو إعدادات الإنترنت: اكتب تفاصيل طلبك وسنقوم بخدمتك فوراً.";
}

  logAiAgent("💬 رد مركز الدعم على ("+label+"): "+finalReply);
  showMessage("success","💬 رد مركز الدعم على ("+label+"):\n"+finalReply);

  if(window.AndroidBridge&&typeof window.AndroidBridge.sendSmsReply==="function"){
    window.AndroidBridge.sendSmsReply(sender,finalReply);
  }
}
window.executeAiCustomerSupport=executeAiCustomerSupport;

const bgSmsQueue=[];
async function processBgSmsQueue(){
  if(isRefreshing||bgSmsQueue.length===0)return;
  const next=bgSmsQueue.shift();
  if(next.mode==="ai_agent"){
    await executeAiCustomerSupport(next.sender,next.rawBody,next.title);
  }else{
    await executeRefresh(next.phone,next.sender,next.mode||"refresh");
  }
  if(bgSmsQueue.length>0)setTimeout(processBgSmsQueue,400);
}
window.executeSmsAutoRefresh=function(targetPhone,senderPhone,mode,rawBody,senderTitle){
  bgSmsQueue.push({
    phone:targetPhone||"",
    sender:senderPhone||"",
    mode:mode||"refresh",
    rawBody:rawBody||"",
    title:senderTitle||""
  });
  processBgSmsQueue();
};

phoneInput.addEventListener("input",e=>{const n=normalizePhoneNumber(e.target.value);if(e.target.value!==n)e.target.value=n;});
langBtn.addEventListener("click",()=>{alertBox.style.display="none";applyLanguage(currentLang==="ar"?"he":"ar");});
form.addEventListener("submit",e=>{e.preventDefault();executeRefresh(phoneInput.value,"","refresh");});
window.addEventListener("DOMContentLoaded",()=>{
  const p=new URLSearchParams(window.location.search);
  applyLanguage(p.get("lang")||currentLang);
  const num=p.get("number")||p.get("phone");
  if(num)phoneInput.value=normalizePhoneNumber(num);
  loadSavedAiLogs();
  syncAiStatusUi();
});
})();
</script>
