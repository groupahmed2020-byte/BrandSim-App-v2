name: Build BRAND SIM APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Organize Project Structure Automatically
        run: |
          mkdir -p app/src/main/java/com/brandsim/refresh
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          MANIFEST_FILE=$(find . -iname "AndroidManifest.xml" | head -n 1)
          if [ -n "$MANIFEST_FILE" ] && [ "$MANIFEST_FILE" != "./app/src/main/AndroidManifest.xml" ]; then
            cp "$MANIFEST_FILE" app/src/main/AndroidManifest.xml
          fi

          JAVA_FILE=$(find . -iname "MainActivity.java" | head -n 1)
          if [ -n "$JAVA_FILE" ] && [ "$JAVA_FILE" != "./app/src/main/java/com/brandsim/refresh/MainActivity.java" ]; then
            cp "$JAVA_FILE" app/src/main/java/com/brandsim/refresh/MainActivity.java
          fi

          HTML_FILE=$(find . -iname "refresh.html" | head -n 1)
          if [ -n "$HTML_FILE" ] && [ "$HTML_FILE" != "./app/src/main/assets/refresh.html" ]; then
            cp "$HTML_FILE" app/src/main/assets/refresh.html
          fi

          ICON_FILE=$(find . -iname "ic_launcher.png" | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            cp "$ICON_FILE" app/src/main/res/drawable/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Generate Gradle Configs
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "BrandSim"
          include ':app'
          EOF
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' version '8.2.0' }
          android {
              namespace 'com.brandsim.refresh'
              compileSdk 34
              defaultConfig {
                  applicationId "com.brandsim.refresh"
                  minSdk 23
                  targetSdk 34
                  versionCode 6
                  versionName "1.5"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload BRAND SIM APK
        uses: actions/upload-artifact@v4
        with:
          name: BRAND-SIM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
