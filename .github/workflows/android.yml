name: Build BRAND SIM APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Organize Project Structure from Root
        run: |
          mkdir -p app/src/main/java/com/brandsim/refresh
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp -f MainActivity.java app/src/main/java/com/brandsim/refresh/MainActivity.java
          cp -f refresh.html app/src/main/assets/refresh.html
          if [ -f "customers.json" ]; then
            cp -f customers.json app/src/main/assets/customers.json
          fi

          for html_file in *.html; do
            if [ -f "$html_file" ]; then
              cp -f "$html_file" "app/src/main/assets/$html_file"
            fi
          done

          for json_file in *.json; do
            if [ -f "$json_file" ]; then
              cp -f "$json_file" "app/src/main/assets/$json_file"
            fi
          done

          cp -f ic_launcher.png app/src/main/res/drawable/ic_launcher.png
          cp -f ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp -f ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp -f ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp -f ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp -f ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Restore Permanent Signing Keystore
        run: |
          echo "" | base64 -d > app/brandsim_permanent.jks

      - name: Generate Gradle Configs with Fixed Signature & Auto VersionCode
        run: |
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "BrandSim"
          include ':app'
          EOF

          VERSION_CODE=$((100 + ${{ github.run_number }}))

          cat << EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.0' }
          android {
              namespace 'com.brandsim.refresh'
              compileSdk 34
              defaultConfig {
                  applicationId "com.brandsim.refresh"
                  minSdk 23
                  targetSdk 34
                  versionCode ${VERSION_CODE}
                  versionName "2.${{ github.run_number }}"
              }
              signingConfigs {
                  permanentConfig {
                      storeFile file("brandsim_permanent.jks")
                      storePassword "brandsim123456"
                      keyAlias "brandsim_key"
                      keyPassword "brandsim123456"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.permanentConfig
                  }
                  release {
                      signingConfig signingConfigs.permanentConfig
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload BRAND SIM APK
        uses: actions/upload-artifact@v4
        with:
          name: BRAND-SIM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
